name: CI
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
on:
  push:
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.14
      - run: uv sync --dev
      # Fatal tier only (syntax errors, undefined names): meaningful signal
      # without demanding a style-cleanup sprint mid-freeze. Widen post-freeze.
      - run: uv run ruff check --select E9,F63,F7,F82 .
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Full history required: harness identity tests use git merge-base --is-ancestor
      # against frozen baseline/checkpoint SHAs (default checkout fetch-depth=1 breaks them).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.14
      - run: uv sync --dev
      - run: uv run playwright install --with-deps chromium
      # Warm tiktoken encoding cache before tests that deny socket I/O (qualification runners).
      - run: uv run python -c "import tiktoken; tiktoken.get_encoding('cl100k_base')"
      - name: Cache pinned MiniLM snapshot (~90MB)
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub/models--sentence-transformers--all-MiniLM-L6-v2
          key: minilm-l6-v2-1110a243fdf4706b3f48f1d95db1a4f5529b4d41
      - name: Provision pinned MiniLM snapshot (network-enabled prep)
        run: uv run python scripts/provision_minilm_snapshot.py
      - name: Clean inference smoke (offline, zero provider)
        run: uv run python scripts/inference_smoke.py
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
      # B2 failure-injection suite + Phase-5 gates. Zero network after prep,
      # zero API cost. Default CI does not require the experimental BGE weights.
      - run: uv run pytest tests/ -v
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

  # PR merge gate: deterministic current semantic contract ($0, zero provider calls).
  # Legacy evals/verifier_golden_test.py (LLM-emitted status oracle) is retained for
  # provenance only; live bounded qualification runs separately. Full benchmark sweep
  # stays in eval.yml (manual workflow_dispatch).
  eval-gate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.14
      - run: uv sync --dev
      - name: "Current-contract semantic gate (deterministic, zero provider)"
        run: ./scripts/run_current_contract_eval_gate.sh -v
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
