name: Eval gates (manual — costs ~$0.07 in API credits)
on:
  workflow_dispatch:
    inputs:
      topics:
        description: "Number of benchmark topics (slice of evals/topics.json)"
        default: "3"

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      qdrant:
        image: qdrant/qdrant:v1.9.2
        ports:
          - 6333:6333
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      QDRANT_URL: http://localhost:6333
      HITL_AUTO_APPROVE: "1"
      # GIT_PUSH_ENABLED deliberately unset -> git_node stays in dry-run.
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.14
      - run: uv sync

      - name: Cache HF model (all-MiniLM-L6-v2, ~90MB)
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-minilm-l6-v2

      # Same no-curl problem as docker-compose; same /dev/tcp fix, host-side.
      - name: Wait for Qdrant
        run: timeout 60 bash -c 'until (exec 3<>/dev/tcp/localhost/6333); do sleep 2; done'

      - name: Ingest KB
        run: uv run python scripts/ingest.py --source kb/seed_docs/

      - name: "Gate 1: verifier golden fixture (>=11/12 grounding, >=10/12 specificity)"
        run: uv run python evals/verifier_golden_test.py

      - name: "Gate 2: telemetry correctness (attribution sums, chunk_index, latency split)"
        run: uv run python scripts/check_telemetry_fields.py

      - name: "Gate 3: benchmark slice (zero failures, per-run UVR <= 0.15)"
        run: uv run python scripts/benchmark.py --limit ${{ inputs.topics }} --gate

      - name: Upload run records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-run-records
          path: |
            outputs/runs/
            outputs/benchmark_results/