<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>content-agent · live pipeline</title>
<link rel="stylesheet" href="/static/app.css"/>
</head>
<body>
<header>
  <h1>content-agent</h1>
  <span class="sub">topic &rarr; grounded draft &rarr; two human gates &rarr; published article</span>
</header>
<main>

  <section class="card" id="setup">
    <div class="row">
      <div>
        <label>Topic</label>
        <input id="topic" placeholder="e.g. Mixture-of-Experts routing" autocomplete="off"/>
      </div>
      <div>
        <label>Bearer token (API_BEARER_TOKEN)</label>
        <input id="token" type="password" placeholder="paste server token" autocomplete="off"/>
      </div>
    </div>
    <div class="row">
      <div>
        <label>Series</label>
        <input id="series" value="Learning Log"/>
      </div>
      <div>
        <label>Live site base URL (for the published link)</label>
        <input id="siteBase" placeholder="https://your-site.netlify.app"/>
      </div>
    </div>
    <div class="btns"><button id="go" type="button">Generate article</button>
      <span class="pill" id="runPill"></span></div>
  </section>

  <section class="card hidden" id="pipeline">
    <h2 class="section">Pipeline</h2>
    <div class="muted" id="pipeSub">running…</div>
    <div class="steps" id="steps"></div>
  </section>

  <section class="card hidden" id="gate1">
    <h2 class="section">Gate 1 · Content review</h2>
    <div class="muted" id="g1meta"></div>
    <iframe id="g1frame" sandbox="" referrerpolicy="no-referrer" title="draft review"></iframe>
    <div id="g1grounding"></div>
    <label>Revision feedback (optional → sends the draft back to revise)</label>
    <textarea id="g1fb" placeholder="e.g. tighten the problem framing; add a failure mode"></textarea>
    <div class="btns">
      <button type="button" data-act="approve" data-gate="1">Approve content</button>
      <button type="button" class="secondary" data-act="feedback" data-gate="1">Request changes</button>
      <button type="button" class="danger" data-act="reject" data-gate="1">Reject</button>
    </div>
  </section>

  <section class="card hidden" id="gate2">
    <h2 class="section">Gate 2 · Layout review <span class="pill">content is frozen</span></h2>
    <div class="muted" id="g2meta"></div>
    <div class="btns"><button type="button" class="secondary" id="g2expand">Expand in-page preview</button></div>
    <iframe id="g2frame" sandbox="" referrerpolicy="no-referrer" title="rendered article"></iframe>
    <div class="warn hidden" id="g2warn"></div>
    <label>Layout / design change only (any visible text or code change is auto-discarded)</label>
    <textarea id="g2fb" placeholder="e.g. move the sources block below takeaways; widen code blocks"></textarea>
    <div class="btns">
      <button type="button" data-act="approve" data-gate="2">Approve &amp; publish</button>
      <button type="button" class="secondary" data-act="feedback" data-gate="2">Request layout change</button>
      <button type="button" class="danger" data-act="reject" data-gate="2">Reject</button>
    </div>
  </section>

  <section class="card hidden" id="done">
    <h2 class="section">Result</h2>
    <div id="doneBody"></div>
    <div class="btns hidden" id="publishBtns">
      <button type="button" id="publishBtn">Publish to live</button>
    </div>
    <div id="livePanel"></div>
  </section>

</main>
<script src="/static/app.js"></script>
</body>
</html>
